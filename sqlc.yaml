version: "2"

sql:
  - engine: "postgresql"
    schema: "supabase/migrations"
    queries: "internal/platform/database/queries"
    gen:
      go:
        package: "db"
        out: "internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
